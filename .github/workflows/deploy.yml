# Su ogni push a main: suite completa, poi deploy su Cloudflare. Se un test fallisce, online resta la versione di prima.
name: Deploy
on:
  push:
    branches: [main]
    # solo documenti → niente test né deploy (il gioco non cambia)
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # l'8 ott 2026 apt si è piantato per 40 minuti: tempo massimo e niente blocco (senza ffmpeg cade solo il contact sheet, che non si riprova)
      - name: ffmpeg (serve al contact sheet)
        timeout-minutes: 5
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Suite completa
        id: suite
        run: npm test
        continue-on-error: true
      # GitHub disegna il gioco a 2-4 fps: un test e2e a tempo può cadere per lentezza. Si riprovano una volta sola le suite e2e cadute;
      # se è caduto qualcosa di deterministico (static, types, sim, budget della build) non si riprova e il deploy non parte.
      - name: Riprova le suite e2e cadute (una volta)
        if: steps.suite.outcome == 'failure'
        run: |
          cadute=$(node -e "const r=require('./tests/out/report.json'); console.log([...new Set(r.results.filter(x=>!x.ok).map(x=>x.suite))].join(' '))")
          echo "Cadute: $cadute"
          for s in $cadute; do case "$s" in static|types|sim|build|runner) echo "::error::$s è deterministico: niente riprova."; exit 1;; esac; done
          da_rifare=$(echo "$cadute" | tr ' ' '\n' | grep -v '^contact$' | tr '\n' ' ')
          if [ -n "$da_rifare" ]; then node tests/run.mjs $da_rifare; fi
      - name: Screenshot e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-out
          path: |
            tests/out/report.json
            tests/out/perf.json
            tests/out/shots/
            tests/out/contact.png
          retention-days: 14
          if-no-files-found: ignore
      - name: Deploy su Cloudflare
        run: node tools/deploy.mjs --no-tail
      - name: Riepilogo
        run: |
          echo "### Online: https://marea.stanza-idee.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          curl -s https://marea.stanza-idee.workers.dev/version.json >> "$GITHUB_STEP_SUMMARY"
