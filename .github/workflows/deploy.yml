# Su ogni push a main: suite completa, poi deploy su Cloudflare. Se un test fallisce, online resta la versione di prima.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: ffmpeg (serve al contact sheet)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Suite completa
        run: npm test
      - name: Screenshot e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-out
          path: |
            tests/out/report.json
            tests/out/perf.json
            tests/out/shots/
            tests/out/contact.png
          retention-days: 14
          if-no-files-found: ignore
      - name: Deploy su Cloudflare
        run: node tools/deploy.mjs --no-tail
      - name: Riepilogo
        run: |
          echo "### Online: https://marea.stanza-idee.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          curl -s https://marea.stanza-idee.workers.dev/version.json >> "$GITHUB_STEP_SUMMARY"
