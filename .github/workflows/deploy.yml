# Su ogni push a main: test veloci (la PR ha già passato tutta la suite, pr.yml) e deploy su Cloudflare. Se qualcosa fallisce, online resta la versione di prima.
name: Deploy
on:
  push:
    branches: [main]
    # solo documenti → niente test né deploy (il gioco non cambia)
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # storia di main: la build ne fa /novita.json, la schermata «Dall'ultima volta»
      - uses: actions/checkout@v4
        with:
          fetch-depth: 300
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # due PR verdi unite una dopo l'altra non si sono mai provate insieme: i test veloci controllano che main si costruisca e si avvii
      - name: Test veloci (static, types, sim, boot)
        run: node tests/run.mjs static types sim boot
      - name: Deploy su Cloudflare
        run: node tools/deploy.mjs --no-tail
      - name: Riepilogo
        run: |
          echo "### Online: https://marea.stanza-idee.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          curl -s https://marea.stanza-idee.workers.dev/version.json >> "$GITHUB_STEP_SUMMARY"
      - name: Screenshot e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-out-deploy
          path: |
            tests/out/report.json
            tests/out/shots/
          retention-days: 14
          if-no-files-found: ignore
