<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#163F73" />
<title>MAREA</title>
<style>
  html, body { margin: 0; height: 100%; background: #163F73; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; font-family: ui-monospace, Menlo, monospace; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #ui { position: fixed; inset: 0; pointer-events: none; color: #F4E3C1; }
  #ui > * { pointer-events: auto; }
  #perf { position: absolute; top: max(6px, env(safe-area-inset-top)); left: 8px; font-size: 12px; background: rgba(46,30,20,.85); padding: 4px 6px; border: 2px solid #5A3A1E; white-space: pre; display: none; }
  #toast { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-size: 14px; background: rgba(46,30,20,.9); padding: 6px 10px; border: 2px solid #C98A4B; opacity: 0; transition: opacity .25s; }
  #joystick { position: absolute; left: 24px; bottom: max(24px, env(safe-area-inset-bottom)); width: 120px; height: 120px; border-radius: 50%; background: rgba(46,30,20,.45); border: 2px solid rgba(244,227,193,.5); touch-action: none; }
  #stick { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; border-radius: 50%; background: rgba(244,227,193,.85); }
  .btn { position: absolute; right: 24px; width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(244,227,193,.6); background: rgba(46,30,20,.55); color: #F4E3C1; font: bold 22px ui-monospace, monospace; display: flex; align-items: center; justify-content: center; touch-action: none; }
  #btnA { bottom: max(40px, env(safe-area-inset-bottom)); background: rgba(232,67,63,.7); }
  #btnB { bottom: calc(max(40px, env(safe-area-inset-bottom)) + 84px); right: 40px; }
  @media (pointer: fine) and (min-width: 900px) { #joystick, .btn { opacity: .35; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui"><div id="perf"></div><div id="toast"></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
