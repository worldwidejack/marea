<!doctype html>

<style>

  #ui { position: fixed; inset: 0; pointer-events: none; color: #F4E3C1; }

  #toast { position: absolute; left: 50%; transform: translateX(-50%); font-size: 14px; background: rgba(46,30,20,.9); padding: 6px 10px; border: 2px solid #C98A4B; opacity: 0; transition: opacity .25s; }
